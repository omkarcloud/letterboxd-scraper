services:
  letterboxd-scraper:
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional — letterboxd.com does not rate-limit a clean IP, so leave this unset.
      # - LETTERBOXD_PROXY=http://user:pass@host:port
